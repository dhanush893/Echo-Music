name: Dhanu Music - Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: temurin
      - name: Build universal release APK
        run: ./gradlew assembleUniversalGmsRelease --no-daemon
      - name: Collect APK
        run: |
          mkdir -p dist
          find app/build/outputs/apk -type f -name '*.apk' -print -exec cp {} dist/Dhanu-Music.apk \;
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Dhanu-Music-APK
          path: dist/Dhanu-Music.apk
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: dhanu-latest
          name: Dhanu Music - Latest
          body: Latest free Dhanu Music Android build.
          files: dist/Dhanu-Music.apk
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
